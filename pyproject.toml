[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antivirus"
version = "1.2.0"
description = "A lightweight, dependency-free antivirus in pure Python (educational)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "codero-sus" }]
keywords = ["antivirus", "scanner", "security", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.scripts]
antivirus = "antivirus.cli:main"

[tool.setuptools]
packages = ["antivirus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
